<!doctype html><html lang="is"><head><meta charset="utf-8"><style>:root {
  --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f0f4fa; --line: #e3e8f0;
  --text: #15315e; --muted: #6b7a93; --faint: #9aa6ba;
  --accent: #15315e; --accent-ink: #ffffff;
  --cta: #f5a623; --cta-ink: #3a2600;
  --navy: #15315e; --info: #15315e; --chip: #eef3fb;
  --done: #2ed3a4; --done-ink: #06352a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }

.app { width: 100%; max-width: 460px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
.header { padding: 16px 18px 0; position: sticky; top: 0; background: var(--navy); z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand .basket { font-size: 22px; }
.header-top { display: flex; align-items: center; gap: 8px; }
.header-spacer { flex: 1; }
.header-title { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.header-title .curtitle { flex: 1; min-width: 0; }
.header-title .count { margin-left: 0; }
.listbtn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; font-size: 18px; font-weight: 600; padding: 8px 12px; border-radius: 11px; }
.listbtn .chev { font-size: 12px; color: var(--cta); }
.listbtn .lists-ico { font-size: 16px; color: var(--cta); }
.count { margin-left: auto; font-size: 12px; color: #cdd9ee; background: rgba(255,255,255,.14); padding: 4px 10px; border-radius: 20px; }
.curtitle { flex: 1; min-width: 0; background: none; border: none; color: #fff; font-size: 18px; font-weight: 600; text-align: left; padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switch-btn { flex: none; display: flex; align-items: center; gap: 3px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; border-radius: 10px; height: 34px; padding: 0 11px; }
.switch-btn .lists-ico { font-size: 16px; color: var(--cta); }
.switch-btn .chev { font-size: 11px; color: var(--cta); }
.tabs { display: flex; gap: 6px; margin-top: 14px; }
.tab { flex: 1; height: 38px; border: 1px solid rgba(255,255,255,.18); background: transparent; border-radius: 9px 9px 0 0; font-size: 14px; color: #a9c0e6; border-bottom: none; }
.tab.active { background: var(--bg); color: var(--navy); border-color: var(--bg); font-weight: 600; }

.body { padding: 12px 16px 96px; }
.addbar { display: flex; gap: 8px; margin: 6px 0 4px; position: relative; }
.addbar input { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: var(--surface); color: var(--text); }
.addbar input::placeholder { color: var(--faint); }
.addbar input:focus { outline: none; border-color: var(--accent); }
.addbar .add { width: 46px; border: none; background: var(--cta); color: var(--cta-ink); border-radius: 12px; font-size: 24px; line-height: 1; font-weight: 600; flex: none; }
.addbar .scan-btn { width: 46px; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 12px; font-size: 20px; line-height: 1; }
.addbar .qty-in { flex: none; width: 56px; text-align: center; padding: 0 6px; font-size: 13.5px; }
.addbar .unit-in { flex: none; width: 54px; text-align: center; padding: 0 6px; font-size: 13.5px; }
.recat-btn { background: none; border: none; font-size: 15px; padding: 4px; flex: none; }
.addbar .day-in { flex: none; width: 74px; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 8px; font-size: 14px; background: var(--surface); color: var(--text); }
.due-tag { font-size: 11px; color: var(--accent); margin-left: 8px; white-space: nowrap; }
.due-tag.overdue { color: #e05a5a; }
.seg3 button { font-size: 13px; padding: 0 6px; }
.addbar .time-in { flex: none; width: 92px; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 8px; font-size: 14px; background: var(--surface); color: var(--text); }
.time-tag { font-size: 12px; font-weight: 600; color: var(--navy); margin-right: 8px; }
.day-nav { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px; }
.day-nav button { width: 38px; height: 34px; border: none; background: var(--chip); color: var(--navy); border-radius: 9px; font-size: 18px; line-height: 1; }
.day-nav-label { font-size: 15px; font-weight: 600; color: var(--navy); }
.timetable { margin-top: 10px; }
.tt-hour { display: flex; gap: 10px; border-top: 1px solid var(--line); min-height: 42px; padding: 2px 0; }
.tt-time { width: 46px; flex: none; font-size: 12px; color: var(--faint); padding-top: 12px; }
.tt-tasks { flex: 1; min-width: 0; }
.tt-tasks .item { border-bottom: none; padding: 7px 4px; }
.suggest { position: absolute; top: 52px; left: 0; right: 58px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; z-index: 10; box-shadow: 0 6px 20px rgba(21,49,94,.10); }
.suggest div { padding: 12px 14px; font-size: 15px; border-bottom: 1px solid var(--line); text-transform: capitalize; color: var(--text); }
.suggest div:last-child { border-bottom: none; }
.suggest div:active { background: var(--chip); }
.suggest .suggest-off { display: flex; align-items: center; gap: 10px; text-transform: none; }
.suggest .suggest-off img { width: 30px; height: 30px; object-fit: contain; border-radius: 6px; background: #fff; flex: none; }
.suggest .suggest-off span { text-transform: none; }
.suggest .suggest-plain { display: flex; align-items: center; }
.suggest .suggest-reward { background: #f0fbf7; }
.sugg-cashback { margin-left: auto; flex: none; font-size: 12px; font-weight: 800; color: var(--done); background: #e6f9f2; padding: 3px 9px; border-radius: 999px; text-transform: none; white-space: nowrap; }
.suggest .suggest-spon { display: flex; align-items: center; gap: 10px; text-transform: none; background: #fff8ec; }
.spon-mark { width: 34px; height: 34px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; overflow: hidden; }
.spon-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.spon-name { flex: 1; font-weight: 600; color: var(--navy); }
.sugg-cashback.spon-cashback { margin-left: 0; margin-right: 6px; }
.spon-tag { font-size: 11px; font-weight: 700; color: var(--cta-ink); background: var(--cta); padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
.spon-badge { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--cta-ink); background: var(--cta); padding: 2px 9px; border-radius: 20px; }
.spon-strip { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 2px 12px; }
.spon-chip { display: inline-flex; align-items: center; gap: 8px; background: #fff8ec; border: 1px solid #f3d49b; color: var(--navy); border-radius: 22px; padding: 6px 12px 6px 6px; font-size: 13px; font-weight: 600; }
.spon-cmark { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; overflow: hidden; }
.spon-cmark img { width: 100%; height: 100%; object-fit: contain; background: #fff; }

/* Aðgerðir efst í lista */
.list-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
.list-actions button { flex: 1; height: 46px; border-radius: 12px; font-size: 15px; font-weight: 700; }
.shop-go { background: var(--cta); color: var(--cta-ink); border: none; }
.shelf-open { background: var(--chip); border: 1px solid var(--line); color: var(--navy); font-weight: 600; }

/* Verslunarhamur */
.shopmode { position: fixed; inset: 0; z-index: 1200; background: var(--bg); display: flex; flex-direction: column; }
.shopmode-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--navy); color: #fff; }
.shopmode-x { background: rgba(255,255,255,.16); border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 22px; flex: none; }
.shopmode-title { font-size: 19px; font-weight: 700; }
.shopmode-prog { margin-left: auto; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.16); padding: 6px 13px; border-radius: 20px; }
.shopmode-body { flex: 1; overflow-y: auto; padding: 8px 12px calc(40px + env(safe-area-inset-bottom)); }
.shopmode-dept { font-size: 14px; font-weight: 700; margin: 18px 4px 8px; }
.shopmode-item { display: flex; align-items: center; gap: 14px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 14px; margin-bottom: 8px; text-align: left; }
.shopmode-check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--faint); flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
.shopmode-check.on { background: var(--done); border-color: var(--done); }
.shopmode-img { width: 46px; height: 46px; object-fit: contain; border-radius: 9px; background: #fff; border: 1px solid var(--line); flex: none; padding: 2px; }
.shopmode-name { font-size: 18px; color: var(--text); text-transform: capitalize; }
.shopmode-item.done .shopmode-name { text-decoration: line-through; color: var(--faint); }
.shopmode-empty { text-align: center; color: var(--muted); margin-top: 50px; font-size: 17px; }
.shelf { background: var(--surface); border-radius: 18px; width: 94%; max-width: 560px; height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
.shelf-top { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.shelf-search { flex: 1; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: var(--surface); color: var(--text); }
.shelf-body { flex: 1; overflow-y: auto; padding: 8px 14px 12px; }
.shelf-head { font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 2px 8px; }
.shelf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shelf-card { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.shelf-card.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.shelf-card.spon { border-color: #f3d49b; background: #fff8ec; }
.shelf-img { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 20px; overflow: hidden; }
.shelf-img img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.shelf-emoji { font-size: 30px; line-height: 1; }
.shelf-filters { display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 10px; border-bottom: 1px solid var(--line); }
.shelf-filters button { white-space: nowrap; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600; }
.shelf-filters button.on { background: var(--chip); }
.shelf-name { font-size: 12px; color: var(--text); text-transform: capitalize; line-height: 1.2; }
.shelf-badge { position: absolute; top: 6px; left: 6px; z-index: 1; font-size: 9px; font-weight: 700; background: var(--cta); color: var(--cta-ink); padding: 1px 6px; border-radius: 20px; }
.shelf-check { position: absolute; top: 6px; right: 6px; z-index: 1; width: 20px; height: 20px; border-radius: 50%; background: var(--done); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.shelf-have { font-size: 10px; color: var(--muted); }
.shelf-foot { padding: 12px 14px; border-top: 1px solid var(--line); }
.shelf-add { width: 100%; height: 48px; border: none; border-radius: 12px; background: var(--cta); color: var(--cta-ink); font-weight: 700; font-size: 16px; }
.shelf-add:disabled { opacity: 0.5; }

.badge { display: inline-block; font-size: 11px; color: var(--muted); background: var(--chip); padding: 4px 10px; border-radius: 20px; margin: 8px 0 0; }
.group { margin-top: 18px; }
.group-head { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; }
.group-head .emoji { font-size: 15px; }
.group-head .name { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.item { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
.check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--faint); display: flex; align-items: center; justify-content: center; flex: none; color: #fff; font-size: 14px; }
.item .label { flex: 1; font-size: 16px; text-transform: capitalize; color: var(--text); }
/* Tryggðarvara á lista → cashback-merki við hlið vörunnar */
.item .label .item-reward { display: inline-block; margin-left: 8px; vertical-align: 2px; font-size: 11.5px; font-weight: 800; color: #12795b; background: #e6f9f2; border: 1px solid rgba(46,211,164,.45); padding: 1px 8px; border-radius: 999px; text-transform: none; white-space: nowrap; }
.item.done .label .item-reward { opacity: .55; }
.item.done .label { text-decoration: line-through; color: var(--faint); }
.item .del { color: var(--faint); font-size: 20px; background: none; border: none; padding: 4px; }
.assign-chip { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; border: none; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: none; }
.assign-add { width: 26px; height: 26px; border-radius: 50%; background: transparent; border: 1px dashed var(--faint); color: var(--faint); font-size: 14px; display: flex; align-items: center; justify-content: center; flex: none; }
.points-badge { background: var(--chip); color: var(--navy); border: 1px solid var(--line); border-radius: 20px; font-size: 11px; font-weight: 600; padding: 3px 9px; flex: none; white-space: nowrap; }
.points-options { display: flex; gap: 8px; flex-wrap: wrap; }
.points-opt { flex: 1; min-width: 52px; height: 46px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; font-size: 17px; font-weight: 600; }
.points-opt.on { border-color: var(--accent); color: var(--accent); background: var(--chip); }
.leaderboard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 12px 0 6px; }
.lb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.lb-head.tap { width: 100%; background: none; border: none; padding: 2px 0; margin-bottom: 0; gap: 8px; text-align: left; }
.lb-peek { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.lb-caret { color: var(--faint); font-size: 12px; flex: none; }
.lb-toggle-row { margin: 8px 0 4px; }
.lb-title { font-size: 13px; font-weight: 600; color: var(--navy); flex: none; }
.lb-toggle { display: flex; gap: 4px; }
.lb-toggle button { height: 28px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; font-size: 12px; }
.lb-toggle button.on { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }
.rec-tag { font-size: 11px; color: var(--muted); margin-left: 8px; white-space: nowrap; }
.rec-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.rec-opt { height: 44px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; font-size: 14px; }
.rec-opt.on { border-color: var(--accent); color: var(--accent); background: var(--chip); font-weight: 600; }
.lb-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.lb-rank { width: 16px; font-size: 13px; color: var(--muted); font-weight: 600; }
.lb-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-points { font-size: 13px; font-weight: 600; color: var(--cta); white-space: nowrap; }
.empty { text-align: center; color: var(--faint); font-size: 14px; margin-top: 48px; }

.recipe { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; }
.recipe .icon { width: 48px; height: 48px; border-radius: 13px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 26px; flex: none; }
.recipe .meta { flex: 1; min-width: 0; }
.recipe .title { font-size: 16px; font-weight: 600; }
.recipe .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.recipe .btn { border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 10px; height: 38px; padding: 0 13px; font-size: 14px; font-weight: 500; white-space: nowrap; }

.back { background: none; border: none; color: var(--accent); font-size: 15px; padding: 6px 0; margin-bottom: 6px; }
.recipe-hero { height: 150px; border-radius: 16px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 80px; margin-bottom: 14px; }
.recipe-h { font-size: 22px; font-weight: 600; margin: 4px 0 2px; }
.recipe-sub2 { font-size: 13px; color: var(--muted); }
.recipe-section { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin: 20px 0 8px; }
.serv { display: flex; align-items: center; gap: 12px; margin: 14px 0 4px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.serv-label { font-size: 15px; font-weight: 500; }
.stepper { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.stepper button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); font-size: 20px; line-height: 1; }
.serv-num { font-size: 17px; font-weight: 600; min-width: 20px; text-align: center; }
.ing-list { list-style: none; padding: 0; margin: 0; }
.ing-list li { display: flex; align-items: center; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
.ing-name { text-transform: capitalize; }
.ing-qty { color: var(--muted); font-size: 14px; white-space: nowrap; padding-left: 12px; }
.steps { margin: 0; padding-left: 22px; }
.steps li { padding: 6px 0; font-size: 15px; line-height: 1.55; }
.add-recipe-btn { width: 100%; margin-top: 22px; height: 50px; background: var(--cta); color: var(--cta-ink); border: none; border-radius: 12px; font-size: 16px; font-weight: 600; }
.match-tag { font-size: 12px; color: var(--accent); margin-top: 3px; }
.cat-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin: 4px -2px 0; }
.cat-chip { flex: 0 0 auto; height: 34px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 20px; font-size: 13px; white-space: nowrap; }
.cat-chip.on { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }

.stars { font-size: 13px; color: #f0b429; letter-spacing: 1px; }
.stars.muted { color: var(--faint); letter-spacing: normal; }
.stars-num { color: var(--muted); font-size: 12px; margin-left: 4px; letter-spacing: normal; }
.rate { display: flex; gap: 6px; }
.star-btn { background: none; border: none; font-size: 30px; line-height: 1; color: var(--line); padding: 2px; }
.star-btn.on { color: #f0b429; }

.reel { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -2px; }
.reel-card { flex: 0 0 auto; width: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text); }
.reel-emoji { font-size: 32px; }
.reel-name { font-size: 12px; text-align: center; line-height: 1.25; }

.recipe-author { font-size: 13px; color: var(--muted); margin-top: 4px; }
.recipe-author a { color: var(--accent); }

/* Uppskriftaform */
.frow { display: flex; gap: 8px; margin-bottom: 10px; }
.frow input, .ing-row input, .ftext { height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 15px; background: var(--surface); color: var(--text); }
.frow input::placeholder, .ing-row input::placeholder, .ftext::placeholder { color: var(--faint); }
.frow input:focus, .ing-row input:focus, .ftext:focus { outline: none; border-color: var(--accent); }
.femoji { width: 56px; text-align: center; font-size: 22px; }
.fname { flex: 1; }
.serv-inline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.serv-inline input { height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface); color: var(--text); }
.ing-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.ftext { height: auto; width: 100%; padding: 12px; line-height: 1.5; font-family: inherit; resize: vertical; }
.ghost-btn { width: 100%; margin-top: 8px; height: 44px; background: transparent; border: 1px dashed var(--accent); color: var(--accent); border-radius: 12px; font-size: 15px; }
.ghost-btn.danger { border-style: solid; border-color: var(--line); color: #e05a5a; margin-top: 10px; }
.seg { display: flex; gap: 8px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(21,49,94,.45); z-index: 40; display: flex; align-items: stretch; justify-content: flex-start; }
.sheet { width: 320px; max-width: 85%; height: 100%; background: var(--surface); border-right: 1px solid var(--line); border-radius: 0 18px 18px 0; padding: 18px 16px 28px; overflow-y: auto; animation: slidein .18s ease-out; }
@keyframes slidein { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.sheet h2 { font-size: 17px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; }
.sheet h2 .x { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 22px; }
.sheet-label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 16px 2px 8px; }
.primary-btn { width: 100%; height: 46px; background: var(--cta); color: var(--cta-ink); border: none; border-radius: 12px; font-size: 15px; font-weight: 600; }
.create-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.scan-receipt-btn { width: 100%; margin-top: 10px; height: 46px; background: var(--surface); border: 1px solid var(--line); color: var(--navy); border-radius: 12px; font-size: 15px; font-weight: 600; }

.ltype { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; }
.linfo { flex: 1; min-width: 0; }
.tpl-link { display: flex; align-items: center; gap: 8px; width: 100%; background: transparent; border: none; color: var(--text); font-size: 15px; padding: 14px 8px; border-top: 1px solid var(--line); margin-top: 10px; }
.tellfriend-btn { width: 100%; margin-top: 16px; height: 44px; background: var(--chip); border: 1px solid var(--line); color: var(--navy); border-radius: 12px; font-size: 14px; font-weight: 600; }

/* Strikamerkjaskanni */
.scan-bg { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.scan-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: relative; width: 78%; max-width: 360px; aspect-ratio: 5 / 3; border: 2px solid rgba(255,255,255,0.9); border-radius: 16px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45); }
.scan-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: var(--cta); box-shadow: 0 0 8px var(--cta); animation: scanmove 2s ease-in-out infinite; }
@keyframes scanmove { 0%,100% { top: 12%; } 50% { top: 88%; } }
.scan-close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border: none; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff; font-size: 26px; line-height: 1; }
.scan-hint { position: absolute; top: 22px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
.scan-error { position: absolute; bottom: 120px; left: 16px; right: 16px; text-align: center; color: #fff; background: rgba(180,40,40,0.92); padding: 12px 14px; border-radius: 12px; font-size: 14px; }
.scan-panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.scan-feed { display: flex; flex-direction: column; gap: 6px; }
.scan-feed-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.94); color: var(--navy); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.scan-feed-row span { font-weight: 700; }
.scan-feed-img { width: 28px; height: 28px; object-fit: contain; border-radius: 6px; background: #fff; flex: none; }
.item-img { width: 52px; height: 52px; object-fit: contain; border-radius: 10px; background: #fff; border: 1px solid var(--line); flex: none; padding: 3px; }
.item-img, .item-cat { transition: transform .14s ease, box-shadow .14s ease; transform-origin: left center; }
@media (hover: hover) {
  .item-img:hover, .item-cat:hover { transform: scale(2.8); position: relative; z-index: 40; box-shadow: 0 10px 28px rgba(21, 49, 94, .35); border-radius: 12px; }
}
.cat-icon { display: inline-flex; align-items: center; justify-content: center; background: var(--navy); border-radius: 13px; flex: none; box-shadow: 0 4px 12px rgba(21,49,94,.16); }
.cat-icon-fill { width: 100%; aspect-ratio: 1 / 1; box-shadow: none; }
.cat-icon-fill svg { width: 58%; height: 58%; }
.item-cat { cursor: pointer; }
.scan-feed-row.ok span { color: #16a34a; }
.scan-feed-row.miss span, .scan-feed-row.dup span { color: var(--muted); }
.scan-done { width: 100%; height: 48px; border: none; border-radius: 12px; background: var(--cta); color: var(--cta-ink); font-size: 16px; font-weight: 700; }
.scan-photo { width: 100%; min-height: 46px; border: 1px solid rgba(255,255,255,0.6); border-radius: 12px; background: rgba(0,0,0,0.45); color: #fff; font-size: 14px; font-weight: 600; padding: 8px 12px; }
.scan-photo:disabled { opacity: 0.7; }

/* Magn-stjórnun á vöru (+/-) */
.qty-step { display: inline-flex; align-items: center; gap: 6px; flex: none; }

/* Tengja óþekkt strikamerki við vöru */

.add-kid-row { color: var(--accent); font-weight: 600; }

/* ===================== Spilun: stigatafla, level, merki, verðlaun ===================== */
.gpanel { margin: 12px 0 6px; }

/* Fjölskyldu-áskorun (vikulegt markmið) */
.fam-challenge { background: linear-gradient(135deg, #2563eb, #06b6d4); color: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.fam-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.fam-title { font-size: 13px; font-weight: 700; }
.fam-edit { background: rgba(255,255,255,.22); border: none; color: #fff; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 4px 9px; white-space: nowrap; }
.fam-bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.28); overflow: hidden; }
.fam-fill { height: 100%; border-radius: 6px; background: #fff; transition: width .4s ease; }
.fam-fill.done { background: var(--cta); }

/* Stigatafla raðir (smellanlegar) */
.lb-row.tap { width: 100%; text-align: left; background: none; border: none; padding: 8px 0; border-top: 1px solid var(--line); }
.lb-row.tap:first-of-type { border-top: none; }
.lb-row.tap:active { background: var(--surface-2); }
.lb-rank { width: 22px; font-size: 15px; text-align: center; color: var(--muted); font-weight: 700; flex: none; }
.lb-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.lb-sub { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
.lb-lvl { font-weight: 600; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-streak { color: #e8615a; font-weight: 700; white-space: nowrap; }
.lb-bal { color: var(--cta-ink); background: #fff5e0; border-radius: 10px; padding: 0 6px; font-weight: 700; white-space: nowrap; }
.lb-points { font-size: 17px; font-weight: 800; color: var(--cta); white-space: nowrap; flex: none; }
.lb-points small { font-size: 11px; font-weight: 600; color: var(--muted); }
.rewards-manage-btn { width: 100%; margin-top: 10px; height: 40px; border: 1px dashed var(--line); background: var(--surface-2); color: var(--navy); border-radius: 10px; font-size: 14px; font-weight: 600; }

/* Prófíl-sheet */
.modal.profile { width: 360px; position: relative; }
.modal.profile .x { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 24px; line-height: 1; }
.prof-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
.prof-avatar { width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 700; overflow: hidden; background: var(--accent); }
.prof-avatar img { width: 100%; height: 100%; object-fit: cover; }
.prof-name { font-size: 20px; font-weight: 700; color: var(--text); }
.prof-level { font-size: 14px; color: var(--muted); margin-top: 2px; }
.prof-bar { height: 12px; border-radius: 7px; background: var(--surface-2); overflow: hidden; margin: 2px 0 4px; }
.prof-fill { height: 100%; border-radius: 7px; background: linear-gradient(90deg, #f5a623, #16a34a); transition: width .5s ease; }
.prof-next { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; }
.prof-stats { display: flex; gap: 8px; margin-bottom: 6px; }
.prof-stat { flex: 1; background: var(--surface-2); border-radius: 12px; padding: 10px 4px; text-align: center; }
.prof-stat b { display: block; font-size: 17px; color: var(--navy); }
.prof-stat span { font-size: 10px; color: var(--muted); }
.prof-section { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin: 18px 0 8px; }

/* Merki */
.badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge-cell { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; text-align: center; }
.badge-cell.locked { opacity: .45; filter: grayscale(1); }
.badge-ico { display: block; font-size: 24px; line-height: 1; }
.badge-name { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.2; }

/* Verðlauna-listi */
.reward-list { display: flex; flex-direction: column; gap: 8px; }
.reward-row { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.reward-row.poor { opacity: .7; }
.reward-emoji { font-size: 22px; flex: none; }
.reward-emoji.big { font-size: 34px; }
.reward-title { flex: 1; min-width: 0; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.reward-cost { font-size: 13px; font-weight: 700; color: var(--cta-ink); background: #fff5e0; border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
.reward-redeem { border: none; background: var(--accent); color: #fff; border-radius: 9px; font-size: 13px; font-weight: 600; padding: 7px 11px; white-space: nowrap; }
.reward-redeem:disabled { background: var(--line); color: var(--muted); }

/* Innleyst saga */
.redeem-hist { display: flex; flex-direction: column; gap: 4px; }
.redeem-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 4px 0; }
.redeem-title { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.redeem-cost { font-weight: 600; color: #e8615a; }

/* Verðlauna-form */
.reward-form { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.reward-form-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.emoji-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 4px; }
.emoji-opt { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 20px; line-height: 1; padding: 0; }
.emoji-opt.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.cost-row { display: flex; gap: 6px; }
.kid-cancel { flex: none; height: 46px; padding: 0 16px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 10px; font-size: 14px; }

/* Foreldra-leiðbeiningar (GameGuide) + ?-takki + ný-vika takki */
.top-btns { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.help-btn { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent); font-size: 15px; font-weight: 800; line-height: 1; }
.modal.guide { width: 380px; position: relative; text-align: left; }
.modal.guide .x { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 24px; line-height: 1; }
.guide-emoji { font-size: 44px; text-align: center; margin: 4px 0 2px; }
.guide-h { font-size: 22px; text-align: center; margin: 4px 0 6px; color: var(--navy); }
.guide-lead { font-size: 14px; color: var(--muted); text-align: center; margin: 0 0 16px; }
.guide-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
.guide-row { display: flex; gap: 12px; align-items: flex-start; }
.guide-ico { font-size: 24px; width: 40px; height: 40px; flex: none; background: var(--chip); border-radius: 11px; display: flex; align-items: center; justify-content: center; }
.guide-title { font-size: 15px; font-weight: 700; color: var(--navy); }
.guide-text { font-size: 13.5px; color: var(--text); line-height: 1.45; margin-top: 2px; }
.guide-foot { font-size: 12px; color: var(--faint); text-align: center; margin: 10px 0 0; }
.newweek-btn { width: 100%; margin: 6px 0 4px; height: 40px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); border-radius: 10px; font-size: 14px; font-weight: 600; }

/* Skema: Vika/Dagur toggle + vikuyfirlit */
.sched-viewtoggle { display: flex; gap: 0; margin: 12px 0 4px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sched-viewtoggle button { flex: 1; height: 40px; border: none; background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; }
.sched-viewtoggle button.on { background: var(--navy); color: #fff; }

.wk-week { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.wk-day { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.wk-day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.wk-day-head { display: flex; align-items: center; gap: 8px; width: 100%; background: var(--surface-2); border: none; padding: 9px 12px; text-align: left; }
.wk-day.today .wk-day-head { background: var(--chip); }
.wk-day-name { flex: 1; font-size: 14px; font-weight: 700; color: var(--navy); }
.wk-day-count { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1px 8px; }
.wk-day-count.all { color: #16a34a; border-color: #16a34a; }
.wk-day-go { color: var(--faint); font-size: 16px; }
.wk-day-tasks { display: flex; flex-direction: column; }
.wk-task { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.wk-task:first-child { border-top: none; }
.wk-task.done .wk-name { text-decoration: line-through; color: var(--muted); }
.wk-check { width: 22px; height: 22px; flex: none; border: 2px solid var(--faint); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; }
.wk-time { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; flex: none; }
.wk-emoji { font-size: 20px; line-height: 1; flex: none; }
.wk-img { width: 26px; height: 26px; object-fit: contain; border-radius: 6px; background: #fff; flex: none; }
.wk-name { flex: 1; min-width: 0; font-size: 14px; color: var(--text); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wk-chip { flex: none; }
.wk-empty { padding: 10px 12px; color: var(--faint); font-size: 13px; }

/* Heimaskjár */
.home-btn { position: relative; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); color: #fff; width: 34px; height: 34px; border-radius: 9px; font-size: 16px; flex: none; }
.home-ping { position: absolute; top: -3px; right: -3px; width: 11px; height: 11px; border-radius: 50%; background: #e8615a; border: 2px solid var(--navy); }
.home { padding: 4px 0 10px; display: flex; flex-direction: column; gap: 16px; }
.home-hi { padding: 4px 2px 0; }
.home-greet { font-size: 22px; font-weight: 700; color: var(--navy); }
.home-ach { font-size: 14px; color: var(--text); margin-top: 4px; line-height: 1.5; }
.home-ach b { color: var(--cta); }
.home-sec-h { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 2px 8px; }
.home-sec { display: flex; flex-direction: column; }
.home-sec .home-row + .home-row { margin-top: 8px; }
.home-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; }
.home-row:active { border-color: var(--accent); }
.home-row-ic { font-size: 20px; flex: none; }
.home-row-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-row-sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
.home-row-go { color: var(--faint); font-size: 17px; flex: none; }
.home-spend { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: linear-gradient(135deg, #15315e, #2563eb); border: none; border-radius: 14px; padding: 14px 16px; color: #fff; }
.home-spend-label { font-size: 13px; opacity: .85; }
.home-spend-val { font-size: 24px; font-weight: 800; margin-top: 2px; }
.home-spend .home-row-go { color: rgba(255,255,255,.7); margin-left: auto; }
.home-feed { display: flex; align-items: flex-start; gap: 10px; padding: 7px 2px; }
.home-feed-ava { width: 30px; height: 30px; flex: none; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.home-feed-txt { font-size: 13px; color: var(--text); line-height: 1.45; }
.home-feed-txt b { font-weight: 700; }
.home-feed-time { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }

/* Lista-tegunda-val: 4 tegundir (2x2) */
.seg4 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg4 button { height: 42px; font-size: 13px; padding: 0 6px; }

/* Bókhald (BudgetView) */
.budget { padding: 4px 0 16px; display: flex; flex-direction: column; gap: 12px; }
.bsum { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #15315e, #2563eb); border-radius: 14px; padding: 14px 16px; color: #fff; }
.bsum-label { font-size: 13px; opacity: .85; }
.bsum-val { font-size: 26px; font-weight: 800; margin-top: 2px; }
.bperiod { display: flex; gap: 4px; }
.bperiod button { height: 30px; padding: 0 10px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; border-radius: 8px; font-size: 12px; }
.bperiod button.on { background: #fff; color: var(--navy); font-weight: 700; border-color: #fff; }
.bactions { display: flex; gap: 8px; }
.bactions .primary-btn { flex: 1; height: 42px; }
.bscan { flex: none; height: 42px; padding: 0 14px; border: 1px solid var(--line); background: var(--surface); color: var(--navy); border-radius: 12px; font-size: 14px; font-weight: 600; }
.bbreak { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; }
.bbreak-row { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; padding: 9px 0; border-top: 1px solid var(--line); }
.bbreak-row:first-child { border-top: none; }
.bbreak-ic { font-size: 17px; flex: none; }
.bbreak-name { width: 92px; flex: none; text-align: left; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bbreak-bar { flex: 1; height: 10px; background: var(--chip); border-radius: 6px; overflow: hidden; }
.bbreak-bar i { display: block; height: 100%; border-radius: 6px; }
.bbreak-amt { flex: none; font-size: 13px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.bfilter-clear { align-self: flex-start; background: var(--chip); border: 1px solid var(--line); color: var(--accent); border-radius: 20px; font-size: 12px; font-weight: 600; padding: 5px 12px; }
.btx-list { display: flex; flex-direction: column; gap: 8px; }
.btx { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
.btx-ic { width: 36px; height: 36px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.btx-main { flex: 1; min-width: 0; background: none; border: none; text-align: left; padding: 0; }
.btx-store { display: block; font-size: 15px; font-weight: 600; color: var(--text); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btx-meta { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.btx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.btx-amt { font-size: 15px; font-weight: 800; color: var(--navy); }
.btx-cat { background: none; border: none; padding: 0; }
.bmode { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.bmode button { flex: 1; height: 38px; border: none; background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; }
.bmode button.on { background: var(--navy); color: #fff; }
.btx-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.btx-wrap .btx { border: none; border-radius: 0; background: none; }
.btx-exp { width: 22px; flex: none; background: none; border: none; color: var(--faint); font-size: 13px; padding: 0; }
.btx-items { border-top: 1px solid var(--line); padding: 4px 11px 8px 33px; display: flex; flex-direction: column; gap: 4px; }
.bitem { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.bitem-name { flex: 1; min-width: 0; font-size: 13px; color: var(--text); text-transform: capitalize; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bitem-price { font-size: 12px; color: var(--muted); white-space: nowrap; }
.bitem-cat { flex: none; border: none; font-size: 10.5px; font-weight: 600; border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
.bedit-items { display: flex; flex-direction: column; gap: 6px; }
.bedit-row { display: flex; gap: 6px; align-items: center; }
.bedit-row > input { height: 40px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; font-size: 14px; background: var(--surface); color: var(--text); flex: 1; min-width: 0; }
.bedit-row .bedit-price { flex: none; width: 72px; text-align: right; }
.bedit-cat { flex: none; width: 38px; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; font-size: 18px; line-height: 1; }
.bedit-cat:disabled { opacity: .4; }
.bedit-del { flex: none; width: 28px; height: 40px; border: none; background: none; color: var(--muted); font-size: 20px; padding: 0; }
.bedit-add { width: 100%; margin-top: 8px; height: 40px; background: transparent; border: 1px dashed var(--line); border-radius: 10px; color: var(--accent); font-size: 14px; font-weight: 600; }
.bedit-total { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 700; color: var(--navy); }
.bedit-total > span { flex: 1; }
.bcat { font-size: 11px; font-weight: 600; border-radius: 20px; padding: 2px 8px; white-space: nowrap; }
.bcat.none { color: var(--muted); background: var(--chip); }
.bcat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.bcat-opt { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; font-size: 14px; text-align: left; }
.bcat-opt span { font-size: 18px; }
.bcat-opt.on { border-color: var(--accent); background: var(--chip); font-weight: 600; }
.bcat-learn { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.4; }
.receipt-datewarn { font-size: 13px; color: #8a5a00; background: #fff6e0; border: 1px solid #f0d28a; border-radius: 10px; padding: 10px 12px; margin: 8px 0 4px; line-height: 1.45; }
.bcat-new { border-style: dashed; border-color: var(--accent); color: var(--accent); font-weight: 600; }
.bcat-new span { font-size: 18px; }

/* Nýr-flokks form */
.bnewcat { display: flex; flex-direction: column; gap: 10px; }
.bnewcat-emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.bemoji { height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 20px; }
.bemoji.on { border-color: var(--accent); background: var(--chip); }
.bnewcat-colors { display: flex; flex-wrap: wrap; gap: 8px; }
.bcolor { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; }
.bcolor.on { border-color: var(--text); box-shadow: 0 0 0 2px var(--surface) inset; }
.bnewcat-actions { display: flex; gap: 8px; }
.bnewcat-actions .ghost-btn, .bnewcat-actions .primary-btn { margin-top: 4px; flex: 1; }

/* Flokka-stjórnun */
.bmanage-cats { align-self: flex-start; margin: -2px 0 2px; background: transparent; border: none; color: var(--muted); font-size: 13px; padding: 4px 0; }
.bcat-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
.bcat-line { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
.bcat-line span { font-size: 18px; }
.bcat-del { margin-left: auto; width: 28px; height: 28px; border: none; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }

.bform-row { display: flex; gap: 8px; margin-bottom: 4px; }
.bform-row .dialog-input { flex: 1; min-width: 0; }

/* Bókhalds-takki í listavalmynd */
.budget-link-btn { width: 100%; margin-top: 8px; height: 46px; border: 1px solid var(--line); background: var(--surface-2); color: var(--navy); border-radius: 12px; font-size: 15px; font-weight: 600; }

/* Bókhalds-kynning (BudgetIntro) með hreyfimynd */
.modal.bintro { width: 360px; position: relative; text-align: center; }
.modal.bintro .x { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--muted); font-size: 24px; }
.bintro-anim { background: var(--surface-2); border-radius: 14px; padding: 16px; margin: 6px 0 14px; }
.bintro-receipt { position: relative; width: 64px; height: 64px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.bintro-rico { font-size: 30px; }
.bintro-scanline { position: absolute; left: 8%; right: 8%; height: 3px; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: bscan 1.6s ease-in-out infinite; }
@keyframes bscan { 0%, 100% { top: 14%; } 50% { top: 80%; } }
.bintro-arrow { font-size: 18px; color: var(--muted); margin: 6px 0; }
.bintro-bars { display: flex; flex-direction: column; gap: 7px; max-width: 220px; margin: 0 auto; }
.bintro-bar { display: flex; align-items: center; gap: 8px; }
.bintro-bar i { display: block; height: 12px; width: 0; border-radius: 6px; animation: bgrow .7s ease forwards; animation-delay: var(--d); }
.bintro-bar b { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
@keyframes bgrow { to { width: var(--w); } }
.bintro-h { font-size: 22px; margin: 4px 0 6px; color: var(--navy); }
.bintro-p { font-size: 14px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
.bintro-steps { display: flex; flex-direction: column; gap: 8px; text-align: left; margin: 0 0 16px; }
.bintro-steps div { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); }
.bintro-steps span { font-size: 20px; width: 28px; text-align: center; flex: none; }
.bintro-skip { width: 100%; margin-top: 10px; background: transparent; border: none; color: var(--muted); font-size: 14px; padding: 8px; }

/* Áminningar — stillingaskjár (NotifSettings) */
.ns-intro { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
.ns-master { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 52px; padding: 0 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--navy); }
.ns-master.on { border-color: var(--done); background: #eafaf4; }
.ns-master:disabled { opacity: .6; }
.ns-switch { width: 44px; height: 26px; border-radius: 20px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.ns-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.ns-switch.on { background: var(--done); }
.ns-switch.on::after { left: 21px; }
.ns-err { color: #e05a5a; font-size: 13px; margin: 8px 2px 0; }
.ns-opts { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
.ns-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--text); }
.ns-row span { display: flex; flex-direction: column; gap: 2px; }
.ns-row small { font-size: 12px; color: var(--muted); font-weight: 400; }
.ns-row input[type=checkbox] { width: 22px; height: 22px; flex: none; accent-color: var(--done); }
.ns-row.sub { padding-left: 12px; }
.ns-row select, .ns-quiet-row select { height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); padding: 0 8px; font-size: 14px; }
.ns-quiet { padding: 12px 2px; }
.ns-quiet-h { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ns-quiet-row { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.ns-hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 12px 2px 0; }
.ns-test { width: 100%; margin-top: 12px; height: 44px; border: 1px solid var(--accent); background: var(--chip); color: var(--accent); border-radius: 12px; font-size: 14px; font-weight: 600; }

/* Áminninga-bjalla á verk */
.rem-bell { background: transparent; border: none; font-size: 16px; padding: 4px; opacity: .45; flex: none; line-height: 1; display: inline-flex; align-items: center; gap: 3px; }
.rem-bell.on { opacity: 1; }
.rem-time { font-size: 11px; font-weight: 700; color: var(--accent); }

/* Heimaskjár — install-ábending */
.home-cashback { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 14px; border: none; background: linear-gradient(120deg, #15315e, #2a5a9e); color: #fff; border-radius: 14px; text-align: left; }
.home-cashback-ic { font-size: 28px; flex: none; }
.home-cashback-txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.home-cashback-txt small { font-size: 12px; color: #cdd9ee; }
.home-cashback-txt b { font-size: 22px; color: var(--cta); }
.home-cashback .home-row-go { color: #cdd9ee; }
.home-cashback.promo .home-cashback-txt b { font-size: 16px; color: #fff; }
.home-cashback.promo .home-cashback-txt small { color: var(--cta); font-weight: 700; }

/* RewardsView */
.rv-balance { background: linear-gradient(120deg, #15315e, #2a5a9e); border-radius: 14px; padding: 20px; text-align: center; margin-bottom: 14px; }
.rv-bal-val { font-size: 34px; font-weight: 800; color: var(--cta); }
.rv-bal-lbl { font-size: 13px; color: #cdd9ee; margin-top: 4px; }
.rv-offer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.rv-offer-txt { display: flex; flex-direction: column; gap: 2px; }
.rv-offer-txt b { font-size: 14px; color: var(--navy); }
.rv-offer-txt small { font-size: 12px; color: var(--muted); }
.rv-th { font-size: 13px; color: var(--muted); }
.rv-reached { font-size: 13px; font-weight: 700; color: var(--done); }
.rv-list { display: flex; flex-direction: column; gap: 2px; }
.rv-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
.rv-item-val { font-weight: 700; color: var(--done); }
.rv-catalog { display: flex; flex-direction: column; gap: 8px; }
.rv-cat-item { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
.rv-cat-img { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; background: var(--surface-2); flex: none; }
.rv-cat-ph { display: flex; align-items: center; justify-content: center; font-size: 22px; }
.rv-cat-txt { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.rv-cat-txt b { font-size: 14px; color: var(--navy); }
.rv-cat-txt small { font-size: 12px; color: var(--muted); }
.rv-cat-reward { font-size: 15px; font-weight: 800; color: var(--done); flex: none; }
.rv-note { font-size: 12px; color: var(--muted); line-height: 1.4; margin: 8px 2px 0; }

.home-invite { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--cta); background: #fff7e8; border-radius: 14px; text-align: left; }
.home-invite-ic { font-size: 26px; flex: none; }
.home-invite-txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.home-invite-txt b { font-size: 14px; color: var(--navy); }
.home-invite-txt small { font-size: 12px; color: var(--muted); line-height: 1.4; }

.home-install { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--accent); background: var(--chip); border-radius: 14px; text-align: left; }
.home-install-ic { font-size: 26px; flex: none; }
.home-install-txt { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.home-install-txt b { font-size: 14px; color: var(--navy); }
.home-install-txt small { font-size: 12px; color: var(--muted); }

/* Persónuvernd / samþykki — fyrsta skipti */
.consent-bg { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 1000; overflow-y: auto; }
.consent-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; text-align: center; }
.consent-ico { font-size: 38px; }
.consent-h { font-size: 22px; color: var(--navy); margin: 8px 0 12px; }
.consent-p { font-size: 14px; color: var(--text); line-height: 1.6; margin: 0 0 16px; text-align: left; }
.consent-more { background: transparent; border: none; color: var(--accent); font-size: 14px; font-weight: 600; padding: 4px; margin-bottom: 6px; }
.consent-detail { text-align: left; background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.consent-detail p { font-size: 13px; color: var(--muted); line-height: 1.55; margin: 0 0 10px; }
.consent-detail p:last-child { margin-bottom: 0; }
.consent-detail b { color: var(--text); }
.consent-ok { width: 100%; height: 50px; background: var(--cta); color: var(--cta-ink); border: none; border-radius: 12px; font-size: 16px; font-weight: 700; }
.consent-ok:disabled { opacity: .6; }

/* Stjórnborð — auglýsinga-rofi */
.adm-ads { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.adm-ads-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.adm-ads-txt b { font-size: 14px; color: var(--navy); }
.adm-ads-txt small { font-size: 12px; color: var(--muted); line-height: 1.4; }
.adm-ads-switch { width: 46px; height: 28px; border-radius: 20px; background: var(--line); border: none; position: relative; flex: none; transition: background .2s; }
.adm-ads-switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.adm-ads-switch.on { background: var(--cta); }
.adm-ads-switch.on::after { left: 21px; }

/* ============ Skrifborðs-útlit (breiður skjár) ============ */
/* Einn hóflega breiður dálkur — EKKI fjöl-dálka. Fjöl-dálka/dashboard útlit er geymt þar til
   alvöru desktop-útgáfa er þróuð (með alltaf-opinni listavalmynd sem nýtir breiddina). */
@media (min-width: 900px) {
  .app { max-width: 640px; padding: 0 20px; }
  .addbar .qty-in { width: 72px; font-size: 15px; }
  .addbar .unit-in { width: 68px; font-size: 15px; }
}

/* ═══ Hönnunarkerfi 1 (okt 2026) — innkaupalisti + haus ═══
   3 litir með merkingu: navy = strúktúr/texti, gull = aðeins aðalaðgerð, grænt = lokið/cashback.
   Rautt aðeins villur/eyða. Allt annað grátt. Ein íkonafjölskylda (Tabler), litur erfist. */
:root { --ink2: #5b6b85; --line2: #e6eaf1; --soft: #f3f5f9; --gold-soft: #fdf3e1; --gold-ink: #8a5a00; --green-ink: #12795b; }

/* Haus — gegnsæir draugahnappar, ljós íkon */
.listbtn, .switch-btn, .home-btn, .admin-btn, .share-btn {
  background: transparent; border: 1px solid transparent; color: #e6edf8;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 600;
}
.listbtn { font-size: 17px; padding: 6px 8px; }
.listbtn:active, .switch-btn:active, .home-btn:active, .admin-btn:active, .share-btn:active { background: rgba(255,255,255,.10); }
.switch-btn { height: 34px; padding: 0 6px; }
.share-btn { width: 34px; height: 34px; }
.count { background: transparent; color: #9fb1cf; padding: 0 2px; font-size: 12.5px; font-weight: 500; }

/* Bæta-við stika */
.addbar .add-input { flex: 1; min-width: 0; position: relative; display: flex; }
.addbar .add-input input { width: 100%; }
.addbar .add-input.with-icon input { padding-left: 40px; }
.addbar .add-input-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.addbar .add, .addbar .scan-btn { display: inline-flex; align-items: center; justify-content: center; }
.addbar .scan-btn { color: var(--navy); border-color: var(--line2); }

/* Tillögur — hlutlaus bakgrunnur, merki bera merkinguna */
.suggest .suggest-reward, .suggest .suggest-spon { background: var(--surface); }
.spon-tag { background: var(--gold-soft); color: var(--gold-ink); font-weight: 600; }
.sugg-cashback { display: inline-flex; align-items: center; gap: 4px; color: var(--green-ink); background: transparent; border: 1px solid rgba(46,170,130,.45); font-weight: 700; }

/* Aðgerðahnappar: Versla = navy, hin draugur */
.list-actions { gap: 8px; margin: 10px 0 6px; }
.list-actions button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; font-size: 14.5px; }
.shop-go { background: var(--navy); color: #fff; }
.shelf-open { background: var(--surface); border: 1px solid var(--line2); color: var(--navy); }

/* Flokkafyrirsagnir — grátt línutákn + grátt heiti */
.group-head { gap: 8px; margin: 4px 0 2px; color: var(--ink2); }
.group-head .dept-ico { display: inline-flex; color: var(--ink2); }
.group-head .name { color: var(--ink2); font-size: 11.5px; letter-spacing: .06em; }
.group-head .group-count { margin-left: auto; font-size: 12px; color: var(--faint); }

/* Línur */
.item { border-bottom-color: var(--line2); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #c3ccda; }
.cat-icon { background: var(--soft); color: var(--navy); box-shadow: none; border-radius: 11px; }
.cat-icon-fill { background: var(--soft); }
.item-img { width: 44px; height: 44px; border-color: var(--line2); }
.qty-step button { display: inline-flex; align-items: center; justify-content: center; border-color: var(--line2); }
.item .del { display: inline-flex; align-items: center; }
.recat-btn { color: var(--faint); display: inline-flex; align-items: center; }
.rec-tag { display: inline-flex; align-items: center; gap: 3px; }

/* Merki á línu: cashback (grænt útlína + gjöf) og kostað (mjúkt gull) */
.item .label .item-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; text-transform: none; }
.item .label .item-tags:empty { display: none; }
.item .label .item-reward { display: inline-flex; align-items: center; gap: 3px; margin-left: 0; vertical-align: 0; background: transparent; border: 1px solid rgba(46,170,130,.45); color: var(--green-ink); font-weight: 700; font-size: 11px; padding: 1px 7px; }
.item .label .item-spon { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; color: var(--gold-ink); background: var(--gold-soft); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.item.done .label .item-spon { opacity: .55; }

/* ═══ Hönnunarkerfi 2 — Heim + Bókhald ═══ */
/* Sameiginlegt: hnappar með línutákni */
.primary-btn, .ghost-btn, .bscan, .bedit-add, .bmanage-cats, .bfilter-clear { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.sheet h2 .x, .modal h2 .x, .x { display: inline-flex; align-items: center; justify-content: center; }
.ghost-btn { border: 1px solid var(--line2); color: var(--navy); }

/* Heim */
.home-ach b { color: var(--navy); }
.home-row-ic { display: inline-flex; color: var(--ink2); }
.home-row-go { display: inline-flex; align-items: center; color: var(--faint); }
.home-row { border-color: var(--line2); }
.home-spend { background: var(--surface); border: 1px solid var(--line2); color: var(--navy); }
.home-spend-label { opacity: 1; color: var(--ink2); }
.home-spend .home-row-go { color: var(--faint); }
.home-cashback { background: var(--navy); }
.home-cashback-ic { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.10); color: #7fe0bf; }
.home-cashback-txt b { color: #7fe0bf; }
.home-cashback.promo .home-cashback-txt small { color: #cdd9ee; font-weight: 600; }
.home-cashback .home-row-go { color: #9fb1cf; }
.home-invite, .home-install { background: var(--surface); border: 1px solid var(--line2); }
.home-invite-ic, .home-install-ic { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 12px; background: var(--soft); color: var(--navy); }
.home-feed-ava { background: var(--soft); color: var(--navy); border: 1px solid var(--line2); }

/* Bókhald / Útgjöld */
.bsum { background: var(--surface); border: 1px solid var(--line2); color: var(--navy); }
.bsum-label { opacity: 1; color: var(--ink2); }
.bperiod button { border-color: var(--line2); color: var(--ink2); }
.bperiod button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.bbreak { border-color: var(--line2); }
.bbreak-row { border-top-color: var(--line2); }
.bbreak-ic { display: inline-flex; color: var(--ink2); width: 20px; justify-content: center; }
.bbreak-bar { background: var(--soft); }
.bbreak-bar i { background: #9fb1cf; }
.bbreak-bar i.on { background: var(--navy); }
.btx-wrap { border-color: var(--line2); }
.btx-exp { display: inline-flex; align-items: center; justify-content: center; }
.bitem-cat { display: inline-flex; align-items: center; gap: 4px; background: var(--soft); color: var(--ink2); }
.bedit-cat { display: inline-flex; align-items: center; justify-content: center; color: var(--navy); border-color: var(--line2); }
.bedit-del, .bcat-del { display: inline-flex; align-items: center; justify-content: center; }
.bcat-opt { border-color: var(--line2); }
.bcat-opt span, .bcat-line span, .bcat-new span { display: inline-flex; color: var(--ink2); }
.bcat-new { border-color: var(--line2); color: var(--navy); }
.bedit-add { color: var(--navy); border-color: var(--line2); }
.bfilter-clear { color: var(--navy); }
.bmode button.on { background: var(--navy); }
.exp-emoji { line-height: 1; }
.bintro-rico, .bintro-arrow { display: inline-flex; color: var(--navy); }
.bintro-arrow { color: var(--faint); }
.bintro-bar i { background: var(--navy); }
.bintro-bar:nth-child(2) i { background: #6f84a8; }
.bintro-bar:nth-child(3) i { background: #9fb1cf; }
.bintro-steps span { display: inline-flex; justify-content: center; color: var(--ink2); }
.onb-cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

/* ═══ Hönnunarkerfi 3 — Gríptu, Vöruhilla, Verslunarhamur, Kvittun, Uppskriftir ═══ */
.h2-ico { display: inline-flex; margin-right: 8px; color: var(--navy); vertical-align: -3px; }
.h2-ico.green { color: var(--green-ink); }
.inline-ico { margin-left: 6px; vertical-align: -1px; color: var(--ink2); }
/* Gríptu/cashback */
.rv-balance { background: var(--navy); }
.rv-bal-val { color: #7fe0bf; }
.rv-reached, .rv-item-val { display: inline-flex; align-items: center; gap: 4px; color: var(--green-ink); }
.rv-st { margin-left: 4px; } .rv-st.pending { color: var(--faint); }
.rv-cat-ph { display: flex; align-items: center; justify-content: center; color: var(--ink2); background: var(--soft); }
.rv-cat-item, .rv-offer, .rv-item { border-color: var(--line2); }
/* Vöruhilla */
.shelf-filters button { display: inline-flex; align-items: center; gap: 5px; border-color: var(--line2); color: var(--ink2); }
.shelf-filters button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.shelf-head { display: flex; align-items: center; gap: 7px; color: var(--ink2); }
.shelf-card { border-color: var(--line2); }
.shelf-card.on { border-color: var(--navy); box-shadow: 0 0 0 2px var(--navy); }
.shelf-card.spon { border-color: var(--line2); background: var(--surface); }
.shelf-badge { background: var(--gold-soft); color: var(--gold-ink); font-weight: 600; }
/* Verslunarhamur */
.shopmode-x, .shopmode-scan { display: inline-flex; align-items: center; justify-content: center; background: transparent; }
.shopmode-prog { background: transparent; color: #9fb1cf; }
.shopmode-dept { display: flex; align-items: center; gap: 7px; color: var(--ink2); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.shopmode-item { border-color: var(--line2); }
.shopmode-check { border-radius: 50%; border-color: #c3ccda; }
/* Kvittun */
.receipt-match { display: inline-flex; align-items: center; gap: 5px; background: transparent; }
.receipt-datewarn { display: flex; gap: 8px; align-items: flex-start; }
.receipt-datewarn svg { flex: none; margin-top: 2px; }
/* Uppskriftir */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--navy); font-weight: 600; }
.match-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--green-ink); }
.stars, .star-btn.on { color: var(--cta); }
.pick-row { border-color: var(--line2); background: var(--surface); }
.pick-dept { display: inline-flex; align-items: center; gap: 10px; }
.pick-dept svg { color: var(--ink2); }

/* ═══ Hönnunarkerfi 4 — listapanell, áminningar, deila, stjórnborð, innskráning ═══ */
.ltype { background: var(--soft); color: var(--navy); }
.lrow2.active { background: var(--soft); }
.lrow2.active .ltype { background: var(--navy); color: #fff; }
.seg button, .sched-viewtoggle button, .kids-btn, .newweek-btn, .emoji-photo-btn, .scan-receipt-btn, .budget-link-btn, .tellfriend-btn, .action-row, .adm-rewards-btn, .rw-scanbtn, .voice-done { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.action-row { justify-content: flex-start; display: flex; background: var(--surface); border-color: var(--line2); }
.action-row svg { color: var(--ink2); } .action-row.danger svg { color: #e05a5a; }
.seg button.on { border-color: var(--navy); color: var(--navy); background: var(--soft); }
.scan-receipt-btn, .budget-link-btn, .tellfriend-btn { background: var(--surface); border-color: var(--line2); }
.inline-row { display: inline-flex; align-items: center; gap: 8px; }
.adm-rewards-btn { border-color: var(--line2); background: var(--surface); }
.rw-thumb-ph { color: var(--ink2); background: var(--soft); }
.rw-scanbtn { border-color: var(--line2); }
.feature-ico { background: var(--soft); color: var(--navy); }
.onb-emoji { display: flex; justify-content: center; color: var(--navy); }
.onb-list li { display: flex; align-items: center; gap: 10px; }
.onb-list li svg { color: var(--ink2); flex: none; }
.consent-ico { display: flex; justify-content: center; color: var(--navy); }
.ns-master-lbl, .ns-quiet-h { display: inline-flex; align-items: center; gap: 7px; }
.due-tag { display: inline-flex; align-items: center; gap: 3px; color: var(--ink2); }
.kids-btn { background: var(--surface); border-color: var(--line2); }
.wk-check { border-color: #c3ccda; }
.bd-h-ico { vertical-align: -3px; margin-right: 2px; }
.bd-seg button { display: inline-flex; align-items: center; gap: 5px; }
.bd-back { display: inline-flex; align-items: center; gap: 4px; }
.bd-bar { background: var(--navy); }
.bd-pbar { background: #9fb1cf; }
.bd-ai { background: var(--surface); border-color: var(--line2); }
.bd-ai-action { background: var(--soft); border-color: var(--line2); }
.assign-add { display: inline-flex; align-items: center; justify-content: center; color: var(--faint); }
